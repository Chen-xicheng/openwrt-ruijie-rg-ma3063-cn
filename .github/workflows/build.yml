name: Build OpenWrt for Ruijie RG-MA3063

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache flex gawk gettext git \
            libelf-dev libncurses5-dev libssl-dev python3 \
            python3-setuptools python3-dev rsync subversion \
            unzip wget xsltproc zlib1g-dev file curl bc

      - name: Checkout OpenWrt source
        run: |
          git clone --depth 1 \
            https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn.git \
            -b main openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_DEVEL=y
          CONFIG_BUILDBOT=y
          CONFIG_CLEAN_IPKG=y
          CONFIG_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_SIGNATURE_CHECK=n
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Show build output
        run: |
          echo "=== Find firmware ==="
          find openwrt/bin -type f \
            \( -name "*.bin" -o -name "*.ubi" -o -name "*.img" \) \

            | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-*
          if-no-files-found: warn
