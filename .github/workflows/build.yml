name: Build MA3063

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: check source
        run: |
          echo "=== 根目录文件 ==="
          ls -la
          echo "=== 搜索 ma3063 相关文件 ==="
          grep -ri "ma3063" --include="*" -l . 2>/dev/null | head -30 || echo "未找到ma3063相关文件"
          echo "=== target/linux 目录 ==="
          ls target/linux/ 2>/dev/null || echo "无target/linux目录"

      - name: update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: config
        run: |
          make defconfig
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' >> .config
          make defconfig

      - name: download
        run: make download -j8 V=s

      - name: build
        run: make -j$(nproc) V=s || make -j1 V=s

      - name: upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/**/*
