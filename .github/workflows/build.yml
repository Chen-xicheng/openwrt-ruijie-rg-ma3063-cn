name: Build OpenWrt for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "OpenWrt source repo"
        required: false
        default: "openwrt/openwrt"
        type: string
      branch:
        description: "Source branch"
        required: false
        default: "openwrt-24.10"
        type: string
      device:
        description: "Target device"
        required: false
        default: "ruijie_rg-ma3063"
        type: string
      extra_packages:
        description: "Extra packages"
        required: false
        default: ""
        type: string

env:
  REPO: ${{ github.event.inputs.repo || 'openwrt/openwrt' }}
  BRANCH: ${{ github.event.inputs.branch || 'openwrt-24.10' }}
  DEVICE: ${{ github.event.inputs.device || 'ruijie_rg-ma3063' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache flex gawk gettext git \
            libelf-dev libncurses5-dev libssl-dev python3 \
            python3-distutils rsync subversion unzip wget xsltproc \
            zlib1g-dev file curl

      - name: Checkout OpenWrt source
        run: |
          git clone --depth 1 \
            https://github.com/${{ env.REPO }}.git \
            -b ${{ env.BRANCH }} openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          cd openwrt

          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_DEVEL=y
          CONFIG_BUILDBOT=y
          CONFIG_CLEAN_IPKG=y
          CONFIG_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_SIGNATURE_CHECK=n
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF

          if [ -n "$EXTRA_PACKAGES" ]; then
            for pkg in $EXTRA_PACKAGES; do
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            done
          fi

          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Show build output
        run: |
          echo "=== Find firmware ==="
          find openwrt/bin -type f \
            \( -name "*.bin" -o -name "*.ubi" -o -name "*.img" \) \

            | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-*
          if-no-files-found: warn
