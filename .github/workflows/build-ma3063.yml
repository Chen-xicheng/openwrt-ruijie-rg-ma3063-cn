name: Build RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'target/linux/qualcommax/**'
      - '.github/workflows/build-ma3063.yml'

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools

      - name: Feeds update and install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for RG-MA3063
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_firmware-ipq-wifi=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX_IPQ50XX=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX_IPQ50XX_DEVICE_RUIJIE_RG-MA3063=y" >> .config
          
          find target/linux -name 'config-*' -type f -exec sed -i \
            -e 's/^CONFIG_NET_DSA_QCA8K_LEDS_SUPPORT=m/# CONFIG_NET_DSA_QCA8K_LEDS_SUPPORT is not set/' \
            -e 's/^CONFIG_NET_DSA_QCA8K=m/CONFIG_NET_DSA_QCA8K=y/' \
            -e 's/^CONFIG_LEDS_CLASS=m/CONFIG_LEDS_CLASS=y/' {} \;
          
          make defconfig

      - name: Inject network and wireless configs
        run: |
          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/board.d/
          cat <<'EOF' > target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network
          case "$board" in
          ruijie,rg-ma3063)
              ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "wan"
              ;;
          esac
          EOF

          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/config/
          cat <<'EOF' > target/linux/qualcommax/ipq50xx/base-files/etc/config/wireless
          config wifi-device 'radio0'
              option type 'mac80211'
              option channel '36'
              option band '5g'
              option path 'platform/soc/c000000.wifi'
              option htmode 'VHT160'
              option ssid 'OpenWrt-MA3063-5G'

          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'OpenWrt-MA3063-5G'
              option encryption 'none'

          config wifi-device 'radio1'
              option type 'mac80211'
              option channel '1'
              option band '2g'
              option path 'platform/soc/c000000.wifi+1'
              option htmode 'HE20'
              option ssid 'OpenWrt-MA3063-2.4G'

          config wifi-iface 'default_radio1'
              option device 'radio1'
              option network 'lan'
              option mode 'ap'
              option ssid 'OpenWrt-MA3063-2.4G'
              option encryption 'none'
          EOF

      - name: Download sources
        run: make -j$(nproc)

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Rename firmware to standard names
        run: |
          # 1. 查找实际的固件输出路径 (自动寻找 qualcommax 下的任意子目录)
          echo "=== 正在寻找实际的固件输出目录 ==="
          ACTUAL_DIR=$(find bin/targets/qualcommax -mindepth 1 -maxdepth 1 -type d | head -n 1)
          
          if [ -z "$ACTUAL_DIR" ]; then
            echo "错误：在 bin/targets/qualcommax/ 下未找到任何子目录！"
            echo "正在打印 bin/targets 的结构以便排查："
            ls -R bin/targets/
            exit 1
          fi

          # 打印目标目录的文件列表
          echo "找到目标目录: $ACTUAL_DIR"
          echo "目录内容如下:"
          ls -la "$ACTUAL_DIR"
          
          # 2. 进入实际存在的目录
          cd "$ACTUAL_DIR"

          # 3. 提取编译出的固件前缀 (例如: openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-2023...)
          SYSUPGRADE_FILE=$(ls *-sysupgrade.bin 2>/dev/null | head -n 1)
          
          if [ -z "$SYSUPGRADE_FILE" ]; then
            echo "错误：当前目录下未找到 *-sysupgrade.bin 文件！请检查上面的 ls 列表。"
            exit 1
          fi

          # 4. 执行重命名 (使用你要求的固定标准名称)
          echo "正在重命名固件..."
          mv "$SYSUPGRADE_FILE" openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
          
          # 对其他文件进行重命名，并忽略不存在的文件 (防止因为某些包没生成而中断)
          mv *-factory.ubi openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi 2>/dev/null || echo "未发现 factory.ubi，跳过"
          mv *-initramfs-uImage.itb openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb 2>/dev/null || echo "未发现 initramfs，跳过"
          mv *.manifest openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest 2>/dev/null || echo "未发现 manifest，跳过"

          # 5. 生成新的校验文件
          sha256sum openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin > sha256sums
          sha256sum openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi >> sha256sums 2>/dev/null
          sha256sum openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb >> sha256sums 2>/dev/null
          sha256sum openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest >> sha256sums 2>/dev/null
