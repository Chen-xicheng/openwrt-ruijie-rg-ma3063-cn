name: Build RG-MA3063 Firmware

on:
  workflow_dispatch: # 允许手动点击触发

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools

      - name: Feeds Update and Install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for RG-MA3063
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_firmware-ipq-wifi=y
          EOF
          make defconfig

      - name: Download Sources
        run: |
          # 【完美匹配原作者】下载编译所需的源码依赖包
          make download -j$(nproc)

      - name: Build Firmware
        run: |
          # 【完美匹配原作者】直接开始编译，绝不清空环境(dirclean)，确保配置生效
          make -j$(nproc)

      - name: Collect and Rename Artifacts
        run: |
          mkdir -p artifacts
          # 寻找 qualcommax 下的真实目录 (通常是 ipq50xx)
          ACTUAL_DIR=$(find bin/targets/qualcommax -mindepth 1 -maxdepth 1 -type d | head -n 1)
          
          if [ -z "$ACTUAL_DIR" ]; then
            echo "致命错误：未找到固件输出目录！"
            ls -R bin/targets/
            exit 1
          fi
          cd "$ACTUAL_DIR"
          
          # 复制所有生成的 ma3063 固件到 artifacts 文件夹
          cp *ma3063* ../../../../artifacts/ 2>/dev/null || true
          cp sha256sums ../../../../artifacts/ 2>/dev/null || true
          
          # 重命名以便上传 Release (根据实际文件重命名，防止找不到)
          cd ../../../../artifacts/
          FINAL_NAME="openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063"
          
          SYSUPGRADE_FILE=$(ls *-sysupgrade.bin 2>/dev/null | head -n 1)
          if [ -n "$SYSUPGRADE_FILE" ]; then
            mv "$SYSUPGRADE_FILE" "${FINAL_NAME}-squashfs-sysupgrade.bin"
          fi
          # 如果生成了 factory 文件也一起重命名
          FACTORY_FILE=$(ls *-factory.ubi 2>/dev/null | head -n 1)
          if [ -n "$FACTORY_FILE" ]; then
            mv "$FACTORY_FILE" "${FINAL_NAME}-squashfs-factory.ubi"
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rg-ma3063-v${{ github.run_number }}
          name: RG-MA3063 OpenWrt Build ${{ github.run_number }}
          body: "自动编译生成的 OpenWrt 固件，完美匹配作者源码配置。"
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
