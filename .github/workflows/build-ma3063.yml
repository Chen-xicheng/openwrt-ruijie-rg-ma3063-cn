name: Build RG-MA3063 OpenWrt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TARGET_PROFILE: ruijie_rg-ma3063
  FIRMWARE_NAME: RG-MA3063-OpenWrt
  MAKE_JOBS: -j$(nproc)

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf git file wget curl rsync unzip python3 python3-pip

      - name: Cache OpenWrt build
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            build_dir
            dl
          key: ${{ runner.os }}-openwrt-ma3063-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ma3063-

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fetch extra packages
        run: |
          cd package
          git clone https://github.com/jerrykuku/luci-theme-argon.git
          git clone https://github.com/jerrykuku/luci-app-argon-config.git
          git clone https://github.com/tsl0922/ttyd.git
          git clone https://github.com/OpenWrt-Actions/luci-app-ttyd.git
          cd ..

      - name: Apply config
        run: |
          cp config.seed .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          make olddefconfig

      - name: Compile firmware
        run: |
          make $MAKE_JOBS V=s

      - name: Generate md5sum
        run: |
          cd bin/targets
          find . -type f ! -name "md5sums" -print0 | xargs -0 md5sum > md5sums

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_NAME }}
          path: bin/targets/**
