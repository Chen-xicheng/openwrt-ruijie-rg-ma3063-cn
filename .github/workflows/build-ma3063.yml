name: Build OpenWrt for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: '是否上传固件 Artifact'
        required: false
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_COMMIT: 486b4a4b3ede480635a185234fc624c969426f13
  TARGET: qualcommax
  SUBTARGET: ipq50xx
  DEVICE: ruijie_rg-ma3063

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出构建仓库（含补丁）
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-distutils python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: 克隆 OpenWrt 源码（指定 commit）
        run: |
          git clone --filter=blob:none https://github.com/openwrt/openwrt openwrt
          cd openwrt
          git checkout ${{ env.REPO_COMMIT }}

      - name: 应用 RG-MA3063 补丁
        run: |
          cd openwrt
          echo "正在应用主源码适配补丁..."
          
          # 补丁文件路径
          PATCH_FILE="../build-repo/patches/0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch"
          
          # 1. 检查文件是否存在
          if [ ! -f "$PATCH_FILE" ]; then
            echo "错误: 未找到目标补丁文件 $PATCH_FILE"
            echo "请检查 build-repo/patches/ 目录下是否存在该文件"
            exit 1
          fi

          # 2. 检查补丁是否能正常应用到当前 OpenWrt 源码
          if git apply --check "$PATCH_FILE"; then
            echo "补丁校验通过，开始应用..."
            git apply -v "$PATCH_FILE"
          else
            echo "错误: 补丁无法应用，可能与当前 OpenWrt 源码版本不匹配！"
            exit 1
          fi

          # 遍历并应用找到的每个补丁
          for p in $PATCHES; do
            echo "=========================================="
            echo "正在应用补丁: $p"
            git apply -v "$p"
          done

      - name: 检出 Argon 主题
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-theme-argon
          path: openwrt/package/luci-theme-argon

      - name: 更新 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          # ===== 目标平台 =====
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y

          # ===== LuCI 基础 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          # ===== Argon 主题 =====
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y

          # ===== TTYD 终端 =====
          CONFIG_PACKAGE_luci-app-ttyd=y

          # ===== 中文语言（可选）=====
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

          # ===== 镜像构建选项 =====
          CONFIG_TARGET_ROOTFS_PARTSIZE=51200
          EOF

      - name: 展开完整配置
        run: |
          cd openwrt
          make defconfig

      - name: 下载编译依赖包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 开始编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 整理固件产物
        run: |
          cd openwrt
          mkdir -p ../output
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f \
            \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" -o -name "*.tar" \) \
            -exec cp {} ../output/ \;
          ls -lh ../output/

      - name: 上传 Artifact
        if: inputs.upload_artifact == 'true' || inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rg-ma3063-${{ github.run_number }}
          path: output/
          retention-days: 7
