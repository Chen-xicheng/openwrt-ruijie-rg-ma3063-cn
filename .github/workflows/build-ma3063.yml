name: Build RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'target/linux/qualcommax/**'
      - '.github/workflows/build-ma3063.yml'

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools

      - name: Feeds update and install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for RG-MA3063 (终极修复版)
        run: |
          # 1. 先运行一次 defconfig 生成原始 .config 文件
          make defconfig

          # 2. 【核心】用 sed 精准定位并修改原始配置
          # 将默认的 Target System (如 mediatek) 替换为 qualcommax
          sed -i 's/# CONFIG_TARGET_qualcommax is not set/CONFIG_TARGET_qualcommax=y/g' .config
          # 将默认的 Subtarget (如 filogic) 替换为 ipq50xx
          sed -i 's/# CONFIG_TARGET_qualcommax_ipq50xx is not set/CONFIG_TARGET_qualcommax_ipq50xx=y/g' .config
          # 将默认的设备型号替换为 RG-MA3063
          sed -i 's/# CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063 is not set/CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y/g' .config

          # 3. 添加必要的 LuCI 和内核模块配置
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_firmware-ipq-wifi=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_NET_DSA_QCA8K=y" >> .config
          echo "CONFIG_LEDS_CLASS=y" >> .config
          echo "# CONFIG_NET_DSA_QCA8K_LEDS_SUPPORT is not set" >> .config

          # 4. 再次运行 defconfig 让所有修改生效并解析依赖
          make defconfig
          
          # 5. 打印配置验证（确认是否成功开启了 qualcommax）
          echo "===== 验证目标平台配置 ====="
          grep "CONFIG_TARGET" .config

      - name: Inject network and wireless configs
        run: |
          # 注入网络配置
          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/board.d/
          cat <<'EOF' > target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network
          case "$board" in
          ruijie,rg-ma3063)
              ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "wan"
              ;;
          esac
          EOF

          # 注入无线网络配置
          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/config/
          cat <<'EOF' > target/linux/qualcommax/ipq50xx/base-files/etc/config/wireless
          config wifi-device 'radio0'
              option type 'mac80211'
              option channel '36'
              option band '5g'
              option path 'platform/soc/c000000.wifi'
              option htmode 'VHT160'
              option ssid 'OpenWrt-MA3063-5G'

          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'OpenWrt-MA3063-5G'
              option encryption 'none'

          config wifi-device 'radio1'
              option type 'mac80211'
              option channel '1'
              option band '2g'
              option path 'platform/soc/c000000.wifi+1'
              option htmode 'HE20'
              option ssid 'OpenWrt-MA3063-2.4G'

          config wifi-iface 'default_radio1'
              option device 'radio1'
              option network 'lan'
              option mode 'ap'
              option ssid 'OpenWrt-MA3063-2.4G'
              option encryption 'none'
          EOF

      - name: Download sources
        run: |
          # 只下载依赖，不执行编译
          make download -j$(nproc) V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          # 使用单线程完整编译并输出详细信息，彻底暴露编译过程
          make -j1 V=s

      - name: Rename firmware to standard names
        run: |
          # 动态寻找 qualcommax 下的真实子目录 (如 ipq50xx)
          ACTUAL_DIR=$(find bin/targets/qualcommax -mindepth 1 -maxdepth 1 -type d | head -n 1)
          
          if [ -z "$ACTUAL_DIR" ]; then
            echo "致命错误：在 bin/targets/qualcommax/ 下未找到任何子目录！"
            ls -R bin/targets/
            exit 1
          fi

          echo "已找到固件目录: $ACTUAL_DIR"
          echo "该目录下的原始文件清单如下："
          ls -la "$ACTUAL_DIR"
          
          cd "$ACTUAL_DIR"

          # 提取真实的文件前缀
          SYSUPGRADE_FILE=$(ls *-sysupgrade.bin 2>/dev/null | head -n 1)
          if [ -z "$SYSUPGRADE_FILE" ]; then
             echo "致命错误：在 $ACTUAL_DIR 下没有找到 sysupgrade.bin！请检查上面的文件清单。"
             exit 1
          fi
          FILE_PREFIX=${SYSUPGRADE_FILE%-sysupgrade.bin}

          # 定义标准文件名
          FINAL_NAME="openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063"
          
          # 开始重命名（带有容错，缺什么就跳过什么）
          echo "正在将固件重命名为标准格式..."
          mv "$FILE_PREFIX-sysupgrade.bin" "${FINAL_NAME}-squashfs-sysupgrade.bin"
          mv "${FILE_PREFIX}-factory.ubi" "${FINAL_NAME}-squashfs-factory.ubi" 2>/dev/null || echo "未发现 factory.ubi 文件，跳过。"
          mv "${FILE_PREFIX}-initramfs-uImage.itb" "${FINAL_NAME}-initramfs-uImage.itb" 2>/dev/null || echo "未发现 initramfs 文件，跳过。"
          mv "${FILE_PREFIX}.manifest" "${FINAL_NAME}.manifest" 2>/dev/null || echo "未发现 manifest 文件，跳过。"

          # 生成 sha256 校验和文件
          sha256sum "${FINAL_NAME}"* > sha256sums 2>/dev/null || true
          echo "重命名完毕，当前目录包含："
          ls -la

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rg-ma3063-${{ github.run_number }}
          name: RG-MA3063 OpenWrt Build ${{ github.run_number }}
          body: "自动编译生成的 OpenWrt 固件。"
          draft: false
          prerelease: false
          files: |
            bin/targets/qualcommax/*/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            bin/targets/qualcommax/*/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi
            bin/targets/qualcommax/*/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb
            bin/targets/qualcommax/*/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest
            bin/targets/qualcommax/*/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
