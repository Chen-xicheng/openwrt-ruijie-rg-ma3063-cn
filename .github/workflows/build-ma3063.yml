name: Build RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'target/linux/qualcommax/**'
      - '.github/workflows/build-ma3063.yml'

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools

      - name: Feeds update and install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for RG-MA3063
        run: |
          # 基础配置开启
          make defconfig
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_firmware-ipq-wifi=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          # 指定设备架构 (使用你源码库中正确的 ipq50xx)
          echo "CONFIG_TARGET_QUALCOMMAX=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX_IPQ50XX=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX_IPQ50XX_DEVICE_RUIJIE_RG-MA3063=y" >> .config
          
          # 修复内核依赖
          find target/linux -name 'config-*' -type f -exec sed -i \
            -e 's/^CONFIG_NET_DSA_QCA8K_LEDS_SUPPORT=m/# CONFIG_NET_DSA_QCA8K_LEDS_SUPPORT is not set/' \
            -e 's/^CONFIG_NET_DSA_QCA8K=m/CONFIG_NET_DSA_QCA8K=y/' \
            -e 's/^CONFIG_LEDS_CLASS=m/CONFIG_LEDS_CLASS=y/' {} \;
          
          make defconfig

      - name: Inject network and wireless configs
        run: |
          # 注入网口映射脚本 (1个WAN + 3个LAN)
          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/board.d/
          cat <<'EOF' > target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network
          case "$board" in
          ruijie,rg-ma3063)
              ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "wan"
              ;;
          esac
          EOF

          # 注入 WiFi 配置文件
          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/config/
          cat <<'EOF' > target/linux/qualcommax/ipq50xx/base-files/etc/config/wireless
          config wifi-device 'radio0'
              option type 'mac80211'
              option channel '36'
              option band '5g'
              option path 'platform/soc/c000000.wifi'
              option htmode 'VHT160'
              option ssid 'OpenWrt-MA3063-5G'

          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'OpenWrt-MA3063-5G'
              option encryption 'none'

          config wifi-device 'radio1'
              option type 'mac80211'
              option channel '1'
              option band '2g'
              option path 'platform/soc/c000000.wifi+1'
              option htmode 'HE20'
              option ssid 'OpenWrt-MA3063-2.4G'

          config wifi-iface 'default_radio1'
              option device 'radio1'
              option network 'lan'
              option mode 'ap'
              option ssid 'OpenWrt-MA3063-2.4G'
              option encryption 'none'
          EOF

      - name: Download sources
        run: make -j$(nproc)

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Rename and Create SHA256
        run: |
          cd $GITHUB_WORKSPACE/bin/targets/qualcommax/ipq50xx/
          
          # 1. 将带版本号前缀的原始文件强制重命名为你想要的完整标准名
          for file in *-sysupgrade.bin; do mv "$file" openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin; done
          for file in *-factory.ubi; do mv "$file" openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi; done
          for file in *-initramfs-uImage.itb; do mv "$file" openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb; done
          for file in *.manifest; do mv "$file" openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest; done

          # 2. 生成 sha256sums 校验文件
          sha256sum *.bin *.ubi *.itb *.manifest > sha256sums

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rg-ma3063-${{ github.run_number }}
          name: RG-MA3063 OpenWrt Build ${{ github.run_number }}
          body: 自动编译生成，包含 sysupgrade.bin 与 factory.ubi
          draft: false
          prerelease: false
          # 3. 直接指定这 5 个重命名后的文件上传，不打包
          files: |
            bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi
            bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb
            bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest
            bin/targets/qualcommax/ipq50xx/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
